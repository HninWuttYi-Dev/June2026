<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  />
  <body>
    <div class="container py-4">
      <div class="row justify-content-center">
        <div class="col-lg-10">
          <!-- Blog Form Card -->
          <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
              <h5 class="card-title mb-0">📝 Blog Manager</h5>
            </div>
            <div class="card-body">
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="blogTitle" class="form-label fw-bold"
                    >Blog Title</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="blogTitle"
                    placeholder="Enter a catchy title"
                  />
                </div>
                <div class="col-md-6">
                  <label for="blogAuthor" class="form-label fw-bold"
                    >Blog Author</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="blogAuthor"
                    placeholder="Author's full name"
                  />
                </div>
                <div class="col-12">
                  <label for="blogContent" class="form-label fw-bold"
                    >Blog Content</label
                  >
                  <textarea
                    class="form-control"
                    id="blogContent"
                    rows="4"
                    placeholder="Write your blog content…"
                  ></textarea>
                </div>
                <div class="col-12 d-flex gap-2">
                  <button type="button" class="btn btn-success" id="btnSave">
                    <i class="bi bi-save"></i> Save Blog
                  </button>
                  <button
                    type="button"
                    class="btn btn-secondary"
                    id="btnCancel"
                    style="display: none"
                  >
                    <i class="bi bi-x-circle"></i> Cancel
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Blog Table Card -->
          <div class="card shadow-sm">
            <div class="card-header bg-light">
              <h5 class="card-title mb-0">📚 All Blogs</h5>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                  <thead class="table-dark">
                    <tr>
                      <th>Actions</th>
                      <th>No.</th>
                      <th>Title</th>
                      <th>Author</th>
                      <th>Content</th>
                    </tr>
                  </thead>
                  <tbody id="tableData">
                    <!-- Rows inserted by loadData() -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./js/jquery-4.0.0.min.js"></script>
    <!-- IndexDB Service -->
    <script src="./js/blogDBService.js"></script>
    <!-- Application Logic -->
    <script>
      //create a single instance of the service
      const blogDB = new BlogDBService();
      // ----------loadData-----------
      async function loadData() {
        const tbody = $("#tableData");
        tbody.html("");
        try {
          const blogs = await blogDB.getAllBlogs();
          console.log(blogs);
          if (blogs.length === 0) {
            tbody.html(
              `<tr>
                    <td colspan="5" class="text-center text-muted">No blogs yet. Create one above!
                    </td>
                </tr>`,
            );
            return;
          }
          blogs.forEach((blog, i) => {
            const trRow = `<tr>
              <td>
                <button type="button" class="btn btn-outline-warning btn-sm" onclick="editBlog('${blog.id}')"> Edit</button>
                <button type="button" class="btn btn-outline-danger btn-sm" onclick="deleteBlog('${blog.id}')"> Delete</button>
              </td>
              <th scope="row">${i + 1}</th>
              <td>${blog.title}</td>
              <td>${blog.author}</td>
              <td>${blog.content}</td>
            </tr>`;
            tbody.append(trRow);
          });
        } catch (error) {
          console.error("loadData error:", error);
          alert("Failed to load blogs");
        }
      }
      $("#btnSave").click(function () {
      if(_editId === null) {
        saveBlog();
      } else {
        updateBlog();
        _editId = null;
      }
      });
      //------------saveBlog--------------------
      async function saveBlog() {
        const _title = $("#blogTitle").val().trim();
        const _author = $("#blogAuthor").val().trim();
        const _content = $("#blogContent").val().trim();
        if (!_title || !_author || !_content) {
          alert("Please fill all fields");
          return;
        }
        const blog = {
          id: crypto.randomUUID(),
          title: _title,
          author: _author,
          content: _content,
        };
        try {
          await blogDB.createBlog(blog);
          console.log("Blog created successfully");
          $("#blogTitle, #blogAuthor, #blogContent").val("");
          await loadData();
        } catch (error) {
          console.error("saveBlog error:", err);
          alert("Failed to save blog. Check console for details.");
        }
      }
      //-------------update blog---------
      async function updateBlog() {
        const _title = $("#blogTitle").val().trim();
        const _author = $("#blogAuthor").val().trim();
        const _content = $("#blogContent").val().trim();
        if (!_title || !_author || !_content) {
          alert("Please fill all fields");
          return;
        }
        try {
            const existingBlog = await blogDB.getBlogById(_editId);
            if(!existingBlog) {
                alert("Blog not found");
                return;
            }
            existingBlog.title = _title;
            existingBlog.author = _author;
            existingBlog.content = _content;
            await blogDB.updateBlog(existingBlog);
            $("#blogTitle, #blogAuthor, #blogContent").val("");
            await loadData();
        } catch (error) {
            
        }
      }
      //------------edit blog-------------
      let _editId = null;
      async function editBlog(id) {
        try {
          const blog = await blogDB.getBlogById(id);
          if (!blog) {
            alert("Blog not found");
            return;
          }
          $("#blogTitle").val(blog.title);
          $("#blogAuthor").val(blog.author);
          $("#blogContent").val(blog.content);
          _editId = blog.id;
        } catch (error) {
          console.error("editBlog error:", error);
          alert("Failed to load blog for editing.");
        }
      }
      //-------------deleteBlog---------
      async function  deleteBlog(id) {
        if (!confirm('Are you sure you want to delete this blog?')) return;
        try {
            await blogDB.deleteBlog(id);
            await loadData();
        } catch (error) {
            console.error('deleteBlog error:', err);
        alert('Failed to delete blog.');
        }
      }
      //initialization
      (async function init() {
        try {
          await blogDB.openDB();
          console.log(" IndexedDB ready");
          await loadData();
        } catch (error) {
          console.error(" Init error:", error);
          alert("Failed to initialize database.");
        }
      })();
    </script>
  </body>
</html>
