  <script>
    // function saveData() {
    //     alert('heheee')
    // }
    loadData();
    $('#btnSave').click(function () {
      if(_editId === null) {
        saveBlog();
      } else {
        updateBlog();
        _editId = null;
      }
    });
    function updateBlog() {
       let _title = $('#blogTitle').val();
      let _author = $('#blogAuthor').val();
      let _content = $('#blogContent').val();
       let jsonBlogs = localStorage.getItem('blogs');
      let blogs = [];
      if (jsonBlogs !== null) {
        blogs = JSON.parse(jsonBlogs);  // JSON/text to object array
      }
      const index = blogs.findIndex(x => x.id === _editId);
      if(index === -1) {
        alert("No data found");
        return;
      }
      blogs[index].title = _title;
      blogs[index].author = _author;
      blogs[index].content = _content;
      let _jsonBlogStr = JSON.stringify(blogs);  //object array to text 
      localStorage.setItem('blogs', _jsonBlogStr);
      loadData();
    }
    function saveBlog() {
      let _title = $('#blogTitle').val();
      let _author = $('#blogAuthor').val();
      let _content = $('#blogContent').val();
      let blog = {
        id: crypto.randomUUID(),
        title: _title,
        author: _author,
        content: _content
      }
      // localStorage.setItem('title', title);
      // localStorage.setItem('author', author);
      // localStorage.setItem('content', content);
      let jsonBlogs = localStorage.getItem('blogs');
      let blogs = [];
      if (jsonBlogs !== null) {
        blogs = JSON.parse(jsonBlogs);  // JSON/text to object array
      }
      //add the new blog to array 
      blogs.push(blog);
      let _jsonBlogStr = JSON.stringify(blogs);  //object array to text 
      localStorage.setItem('blogs', _jsonBlogStr);
      loadData();
    }
    function loadData() {
      $('#tableData').html('');
      let jsonBlog = localStorage.getItem("blogs");
      let blogs = [];
      if (jsonBlog !== null) {
        blogs = JSON.parse(jsonBlog);
      }
      // for (let i = 0; i < blogs.length; i++){
      //   const blog = blogs[i];
      //   let trRow = `
      //    <tr>
      //     <th scope="row">${i+1}</th>
      //     <td>${blog.title}</td>
      //     <td>${blog.author}</td>
      //     <td>${blog.content}</td>
      //   </tr>
      //   `
      //   $('#tableData').append(trRow);
      // }
      blogs.forEach((blog, i) => {
        let trRow = `
      <tr>
        <td>
       <button type="button" class="btn btn-outline-warning" onclick="editBlog('${blog.id}')">Edit</button>
        <button type="button" class="btn btn-outline-danger" onclick="deleteBlog('${blog.id}')">Delete</button>
      </td>
        <th scope="row">${i + 1}</th>
        <td>${blog.title}</td>
        <td>${blog.author}</td>
        <td>${blog.content}</td>
      </tr>
    `;
        $('#tableData').append(trRow);
      });
    }
    let _editId = null;
    function editBlog(id) {
      let jsonBlogs = localStorage.getItem('blogs');
      let blogs = [];
      if (jsonBlogs !== null) {
        blogs = JSON.parse(jsonBlogs);
      }
      let filterBlog = blogs.filter(x => x.id === id);
      if (filterBlog.length === 0) return;
      let blog = filterBlog[0];
      $('#blogTitle').val(blog.title);
      $('#blogAuthor').val(blog.author);
      $('#blogContent').val(blog.content);
      _editId = blog.id

    }
    function deleteBlog(id) {
      let confirmMessage = confirm("Are you sure to delete the blog?");
      if(!confirmMessage) return;
      let jsonBlogs = localStorage.getItem('blogs');
      let blogs = [];
      if (jsonBlogs !== null) {
        blogs = JSON.parse(jsonBlogs);
      }
      const index = blogs.findIndex(x=> x.id === id);
      if(index === -1) {
        alert("Data is not found");
        return;
      }
      let filterBlog = blogs.filter(x => x.id !== id);
      let _jsonBlogStr = JSON.stringify(filterBlog);
      localStorage.setItem('blogs', _jsonBlogStr);
      loadData();
    }

  </script>
